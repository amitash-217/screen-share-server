listening-port=3478
min-port=49152
max-port=65535
use-auth-secret
realm=screentalk
fingerprint
no-cli
# Relays are for reaching other users, never this server's own network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# A room has at most 4 people, so a handful of relays per credential is plenty.
user-quota=12
total-quota=300
