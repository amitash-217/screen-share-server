name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Service containers only work on Linux runners, so the database tests live here.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:test@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # Few test threads: each database test opens its own pool and Postgres has a connection limit.
      - run: cargo test -p protocol -p server -- --test-threads=4

  # The deploy files must at least build and parse.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.server -t screentalk-server .
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example --profile tls config -q

  # The apps people run. libwebrtc's prebuilt binaries (about 280 MB) are downloaded by the build.
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests that need a database skip themselves without DATABASE_URL.
      - run: cargo test -p protocol -p client -p sysaudio
      - run: cargo build --release -p client
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/client.exe -DestinationPath ScreenTalk-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ runner.os }}
          path: |
            target/bundle/ScreenTalk-macos.zip
            ScreenTalk-windows.zip
          if-no-files-found: error

  # Runs the client's tests against a real server. Not a release gate: libwebrtc on Linux needs
  # system libraries that nobody has verified yet.
  client-net:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:test@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev
          libxkbcommon-dev libx11-dev libxext-dev libxcomposite-dev libxdamage-dev libxfixes-dev
          libxrandr-dev libgbm-dev libdrm-dev libglib2.0-dev libgl1-mesa-dev libasound2-dev
      - run: cargo test -p client -- --test-threads=4

  # Pushing a tag like v0.1.0 publishes the packaged apps.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, deploy, client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ScreenTalk-macos.zip
            artifacts/ScreenTalk-windows.zip
